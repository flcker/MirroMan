[package]
name = "mirroman"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
directories = "6"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["rustls-tls", "blocking"], default-features = false }
tokio = { version = "1", features = ["rt", "macros", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
